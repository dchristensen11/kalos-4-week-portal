<style>
:root {
  --bg: #F4F6FF;
  --surface: #FFFFFF;
  --border: #DDE3FF;
  --border-dark: #C5CFFF;

  --success-bg: #f0fdf4;
  --success-border: #bbf7d0;
  --warn: #d97706;
  --warn-bg: #fffbeb;

/* Auto dark — OS preference */

    --dark: #eef0ff;
    --text: #e4e7f8;
    --text-sec: #8e94be;
    --text-muted: #555d84;
    --success: #22c55e;
    --success-bg: rgba(34,197,94,0.1);
    --success-border: rgba(34,197,94,0.28);
    --warn: #f59e0b;
    --warn-bg: rgba(245,158,11,0.1);
    --warn-border: rgba(245,158,11,0.28);
    --danger: #f87171;
    --danger-bg: rgba(248,113,113,0.1);
    --danger-border: rgba(248,113,113,0.28);
    --badge-neutral-bg: #1e2130;
    --hdr-bg: rgba(15,17,23,0.96);
    --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.25);
  }
}

/* Force dark */
html[data-theme="dark"] {
  --bg: #0f1117;
  --surface: #181b26;
  --border: #252838;
  --border-dark: #333750;
  --primary-light: rgba(67,110,250,0.35);
  --primary-dim: rgba(67,110,250,0.12);
  --primary-dim2: rgba(67,110,250,0.2);
  --dark: #eef0ff;
  --text: #e4e7f8;
  --text-sec: #8e94be;
  --text-muted: #555d84;
  --success: #22c55e;
  --success-bg: rgba(34,197,94,0.1);
  --success-border: rgba(34,197,94,0.28);
  --warn: #f59e0b;
  --warn-bg: rgba(245,158,11,0.1);
  --warn-border: rgba(245,158,11,0.28);
  --danger: #f87171;
  --danger-bg: rgba(248,113,113,0.1);
  --danger-border: rgba(248,113,113,0.28);

}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  line-height:1.6;-webkit-font-smoothing:antialiased;
}
.hdr{
  position:sticky;top:0;z-index:100;
  background:var(--hdr-bg);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  height:62px;display:flex;align-items:center;
  justify-content:space-between;padding:0 32px;
}
.logo{font-size:15px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:var(--dark);}
.logo-dot{color:var(--primary);}
.hdr-right{display:flex;align-items:center;gap:12px;}
.hdr-pill{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--primary);background:var(--primary-dim2);border:1px solid var(--primary-light);border-radius:100px;padding:4px 14px;}
.sync-dot{font-size:11px;font-weight:600;display:flex;align-items:center;gap:5px;color:var(--text-muted);}
.sync-dot::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--border-dark);}
.sync-dot.syncing::before{background:var(--warn);animation:pulse 1s infinite;}
.sync-dot.synced{color:var(--success);}
.sync-dot.synced::before{background:var(--success);}
.sync-dot.error{color:#dc2626;}
.sync-dot.error::before{background:#dc2626;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

.wrap{max-width:860px;margin:0 auto;padding:48px 32px 100px;}
.page-title{font-size:36px;font-weight:800;letter-spacing:-0.03em;color:var(--dark);margin-bottom:6px;}
.page-sub{font-size:15px;color:var(--text-sec);margin-bottom:40px;}
.section{margin-bottom:40px;}
.section-hd{font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--primary);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.section-hd span{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:none;letter-spacing:0;}

/* Add member form */
.add-form{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;}
.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:180px;}
.field label{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-sec);}
.field input{height:40px;border:1px solid var(--border-dark);border-radius:var(--radius);padding:0 12px;font-size:14px;color:var(--text);background:var(--surface);outline:none;transition:border-color .15s;}
.field input:focus{border-color:var(--primary);}
.btn{height:40px;padding:0 20px;border-radius:var(--radius);font-size:13px;font-weight:700;cursor:pointer;border:none;transition:all .15s;white-space:nowrap;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--text-sec);border:1px solid var(--border-dark);}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary);}

/* Queue cards */
.queue-empty{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:32px;text-align:center;color:var(--text-muted);font-size:14px;}
.queue-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;margin-bottom:10px;box-shadow:var(--shadow);}
.queue-card.urgent{border-left:3px solid var(--primary);}
.queue-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.queue-member{font-size:17px;font-weight:700;color:var(--dark);}
.queue-meta{display:flex;align-items:center;gap:8px;}
.badge{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:3px 10px;border-radius:100px;}
.badge-lesson{background:var(--primary-dim2);color:var(--primary);border:1px solid var(--primary-light);}
.badge-day{background:var(--badge-neutral-bg);color:var(--text-sec);border:1px solid var(--border-dark);}
.badge-overdue{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-border);}
.queue-title{font-size:13px;font-weight:600;color:var(--text-sec);margin-bottom:10px;}
.queue-msg{font-size:14px;color:var(--text-sec);line-height:1.7;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;white-space:pre-wrap;word-break:break-word;}
.queue-actions{display:flex;gap:8px;flex-wrap:wrap;}
.btn-copy{background:var(--primary-dim2);color:var(--primary);border:1px solid var(--primary-light);font-size:12px;height:34px;padding:0 16px;}
.btn-copy:hover{background:var(--primary);color:#fff;border-color:var(--primary);}
.btn-copy.copied{background:var(--success-bg);color:var(--success);border-color:var(--success-border);}
.btn-sent{background:var(--success-bg);color:var(--success);border:1px solid var(--success-border);font-size:12px;height:34px;padding:0 16px;}
.btn-sent:hover{background:var(--success);color:#fff;}
.btn-sent:disabled{opacity:.5;cursor:not-allowed;}

/* Member list */
.member-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:8px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow);}
.member-name{font-size:15px;font-weight:700;color:var(--dark);flex:1;}
.member-start{font-size:12px;color:var(--text-muted);}
.progress-bar{flex:2;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;background:var(--primary);border-radius:3px;transition:width .3s;}
.progress-label{font-size:11px;font-weight:600;color:var(--text-sec);min-width:48px;text-align:right;}
.btn-remove{background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:18px;line-height:1;padding:4px;border-radius:var(--radius);transition:color .15s;}
.btn-remove:hover{color:var(--danger);}
.btn-theme{background:none;border:1px solid var(--border-dark);border-radius:var(--radius);width:34px;height:34px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--text-sec);transition:border-color .15s,color .15s;}
.btn-theme:hover{border-color:var(--primary);color:var(--primary);}

/* Loader */
.loader{text-align:center;padding:40px;color:var(--text-muted);font-size:14px;}

/* Today header */
.today-date{font-size:13px;font-weight:600;color:var(--text-muted);}

@media(max-width:600px){
  .hdr{padding:0 16px;}
  .wrap{padding:32px 16px 60px;}
  .add-form{flex-direction:column;}
  .member-row{flex-wrap:wrap;}
}
</style>

<script>
// ── Supabase config ────────────────────────────────────────────────────────
const SB_URL = 'https://znxvxtdipuuvmfnyxiib.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpueHZ4dGRpcHV1dm1mbnl4aWliIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDc2ODQsImV4cCI6MjA5NjU4MzY4NH0.l1x0V7W5LHiHK9FjbW9FWaQJI7tUHwshPWDr7Mv9GGc';
const BASE = SB_URL + '/rest/v1/members';

function sbHeaders(extra = {}) {
  return {
    'apikey': SB_KEY,
    'Authorization': 'Bearer ' + SB_KEY,
    'Content-Type': 'application/json',
    ...extra
  };
}

// ── In-memory cache ────────────────────────────────────────────────────────
let members = [];

// Message text store — avoids embedding raw strings in onclick HTML attributes
const MSG_STORE = {};

// Row shape from Supabase uses snake_case; JS uses camelCase internally
function fromDb(row) {
  return { id: row.id, name: row.name, startDate: row.start_date, sent: row.sent || [] };
}

function toDb(m) {
  return { id: m.id, name: m.name, start_date: m.startDate, sent: m.sent || [] };
}

// ── Sync indicator ─────────────────────────────────────────────────────────
function setStatus(state, label) {
  const el = document.getElementById('sync-indicator');
  el.className = 'sync-dot ' + state;
  const labels = { syncing: 'Saving', synced: 'Synced', error: 'Error', loading: 'Loading' };
  el.textContent = label || labels[state] || state;
}

// ── Supabase API layer ─────────────────────────────────────────────────────
async function fetchAllMembers() {
  setStatus('loading');
  try {
    const res = await fetch(BASE + '?select=*&order=created_at.asc', { headers: sbHeaders() });
    if (!res.ok) throw new Error(await res.text());
    const rows = await res.json();
    members = rows.map(fromDb);
    setStatus('synced');
  } catch(e) {
    setStatus('error', 'Error');
    console.error('Fetch error:', e);
  }
}

async function insertMember(m) {
  setStatus('syncing');
  try {
    const res = await fetch(BASE, {
      method: 'POST',
      headers: sbHeaders({ 'Prefer': 'return=minimal' }),
      body: JSON.stringify(toDb(m))
    });
    if (!res.ok) throw new Error(await res.text());
    setStatus('synced');
    return true;
  } catch(e) {
    setStatus('error', 'Error');
    console.error('Insert error:', e);
    return false;
  }
}

async function patchSent(id, sent) {
  setStatus('syncing');
  try {
    const res = await fetch(BASE + '?id=eq.' + encodeURIComponent(id), {
      method: 'PATCH',
      headers: sbHeaders({ 'Prefer': 'return=minimal' }),
      body: JSON.stringify({ sent })
    });
    if (!res.ok) throw new Error(await res.text());
    setStatus('synced');
    return true;
  } catch(e) {
    setStatus('error', 'Error');
    console.error('Patch error:', e);
    return false;
  }
}

async function deleteMemberDb(id) {
  setStatus('syncing');
  try {
    const res = await fetch(BASE + '?id=eq.' + encodeURIComponent(id), {
      method: 'DELETE',
      headers: sbHeaders()
    });
    if (!res.ok) throw new Error(await res.text());
    setStatus('synced');
    return true;
  } catch(e) {
    setStatus('error', 'Error');
    console.error('Delete error:', e);
    return false;
  }
}

// ── DM data ────────────────────────────────────────────────────────────────
const DMS = [
  { lesson: 1,  day: 1,  title: "The Foundation",
    text: "Welcome to your first week. Before your first workout, I want to give you the framework that makes the next four weeks actually work. Most programs skip this entirely. Read it tonight.\n👉 https://4-weeks.kaloscoach.app/#lesson-1" },

    text: "One week in. Now we go deeper: your exact protein target, how to hit it every day, and the five daily habits that quietly drive everything else. A lot of value packed into this one.\n👉 https://4-weeks.kaloscoach.app/#lesson-3" },
  { lesson: 4,  day: 10, title: "The Hidden 20%",
    text: "Perfect training and perfect nutrition still leave you 20% short if you ignore what happens between sessions. Sleep, hydration, steps, sunlight, stress: this lesson is about the variables most programs never address.\n👉 https://4-weeks.kaloscoach.app/#lesson-4" },
  { lesson: 5,  day: 13, title: "The Magic of Movement",
    text: "You train about 3 hours a week. Here is what is happening in the other 165, and why it shapes a bigger portion of your results than most people realize. This one is worth reading twice.\n👉 https://4-weeks.kaloscoach.app/#lesson-5" },
  { lesson: 6,  day: 16, title: "The Nutrition System",
    text: "Every popular diet works through the same mechanism. Once you understand the system underneath all of them, you stop following rules and start making real decisions. This is the framework.\n👉 https://4-weeks.kaloscoach.app/#lesson-6" },
  { lesson: 7,  day: 19, title: "When Motivation Disappears",
    text: "Motivation brought you here. By now it has probably faded a bit, and that is completely normal. This lesson is about what carries you through when motivation does not show up.\n👉 https://4-weeks.kaloscoach.app/#lesson-7" },

  { lesson: 9,  day: 25, title: "Full Execution Mode",
    text: "Three and a half weeks in. Week 4 is where everything you have built starts compounding, if you push it instead of coast. Here is how to make the last week count.\n👉 https://4-weeks.kaloscoach.app/#lesson-9" },
  { lesson: 10, day: 28, title: "The Long Game",
    text: "Four weeks ago you started something most people never start. You showed up when it was hard and followed through when it would have been easy not to. Here is what you built, and what comes next.\n👉 https://4-weeks.kaloscoach.app/#lesson-10" }
];

// ── Helpers ────────────────────────────────────────────────────────────────
function uid() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }
function toDateStr(date) { return date.toISOString().split('T')[0]; }
function today() { return toDateStr(new Date()); }
function addDays(dateStr, days) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return toDateStr(d);
}
function formatDate(dateStr) {
  return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function getDueDate(member, dm) { return addDays(member.startDate, dm.day - 1); }
function isOverdue(member, dm) { return getDueDate(member, dm) < today(); }
function getDueMessages(member) {
  const t = today();
  return DMS.filter(dm => getDueDate(member, dm) <= t && !(member.sent || []).includes(dm.lesson));
}
function getProgress(member) {
  return { sent: (member.sent || []).length, total: DMS.length };
}

// ── Copy to clipboard ──────────────────────────────────────────────────────
async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
  } catch(e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none;';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand('copy'); } catch(e2) {}
    document.body.removeChild(ta);
  }
  btn.textContent = 'Copied!';
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = 'Copy Message'; btn.classList.remove('copied'); }, 2000);
}

// ── UI actions ─────────────────────────────────────────────────────────────
async function addMember() {
  const name = document.getElementById('inp-name').value.trim();
  const date = document.getElementById('inp-date').value;
  if (!name || !date) { alert('Please enter a name and start date.'); return; }
  const btn = document.getElementById('btn-add');
  btn.disabled = true;
  const m = { id: uid(), name, startDate: date, sent: [] };
  members.push(m);
  render();
  const ok = await insertMember(m);
  if (!ok) {
    members = members.filter(x => x.id !== m.id); // rollback
    render();
    alert('Could not save member. Check your connection and try again.');
  } else {
    document.getElementById('inp-name').value = '';
    document.getElementById('inp-date').value = today();
  }
  btn.disabled = false;
}

async function removeMember(id) {
  if (!confirm('Remove this member from the tracker?')) return;
  const prev = members.slice();
  members = members.filter(m => m.id !== id);
  render();
  const ok = await deleteMemberDb(id);
  if (!ok) {
    members = prev; // rollback
    render();
    alert('Could not remove member. Check your connection and try again.');
  }
}

async function markSent(memberId, lesson) {
  const m = members.find(m => m.id === memberId);
  if (!m || m.sent.includes(lesson)) return;
  m.sent = [...m.sent, lesson];
  render();
  await patchSent(memberId, m.sent);
}

async function refreshAll() {
  await fetchAllMembers();
  render();
}

// ── Export / Import ────────────────────────────────────────────────────────
function exportMembers() {
  if (members.length === 0) { alert('No members to export.'); return; }
  const blob = new Blob([JSON.stringify(members, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'kalos-drip-members-' + today() + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

async function importMembers(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (!Array.isArray(imported)) throw new Error('Invalid format');
      const existingIds = new Set(members.map(m => m.id));
      const newMembers = imported.filter(m => !existingIds.has(m.id));
      if (newMembers.length === 0) { alert('No new members to import.'); return; }
      // Insert each new member
      let added = 0;
      for (const m of newMembers) {
        const ok = await insertMember(m);
        if (ok) { members.push(m); added++; }
      }
      render();
      alert(added + ' member(s) imported successfully.');
    } catch(e) {
      alert('Could not read file. Make sure it is a valid Kalos export.');
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  const t = today();

  document.getElementById('today-label').textContent =
    new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

  document.getElementById('member-count').textContent =
    members.length + ' member' + (members.length !== 1 ? 's' : '');

  // Queue
  const queueItems = [];
  members.forEach(member => {
    getDueMessages(member).forEach(dm => {
      queueItems.push({ member, dm, overdue: isOverdue(member, dm) });
    });
  });

  const queueEl = document.getElementById('queue');
  if (queueItems.length === 0) {
    queueEl.innerHTML = '<div class="queue-empty">No messages due today. Check back tomorrow.</div>';
  } else {
    queueEl.innerHTML = queueItems.map(({ member, dm, overdue }) => {
      const dueDateStr = formatDate(getDueDate(member, dm));
      const msgKey = member.id + '-' + dm.lesson;
      MSG_STORE[msgKey] = dm.text;
      return `
        <div class="queue-card urgent">
          <div class="queue-top">
            <div class="queue-member">${member.name}</div>
            <div class="queue-meta">
              ${overdue ? `<span class="badge badge-overdue">Overdue: ${dueDateStr}</span>` : ''}
              <span class="badge badge-lesson">Lesson ${dm.lesson}</span>
              <span class="badge badge-day">Day ${dm.day}</span>
            </div>
          </div>
          <div class="queue-title">${dm.title}</div>
          <div class="queue-msg">${dm.text}</div>
          <div class="queue-actions">
            <button class="btn btn-copy" onclick="copyText(MSG_STORE['${msgKey}'], this)">Copy Message</button>
            <button class="btn btn-sent" onclick="markSent('${member.id}', ${dm.lesson})" id="sent-${member.id}-${dm.lesson}">Mark as Sent</button>
          </div>
        </div>`;
    }).join('');
  }

  // Member list
  const listEl = document.getElementById('member-list');
  if (members.length === 0) {
    listEl.innerHTML = '<div class="queue-empty">No members yet. Add one above.</div>';
  } else {
    listEl.innerHTML = members.map(member => {
      const { sent, total } = getProgress(member);
      const pct = Math.round((sent / total) * 100);
      const dueCount = getDueMessages(member).length;
      return `
        <div class="member-row">
          <div>
            <div class="member-name">${member.name}</div>
            <div class="member-start">Started ${formatDate(member.startDate)}${dueCount > 0 ? ` &nbsp;·&nbsp; <strong style="color:var(--primary)">${dueCount} due today</strong>` : ''}</div>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="progress-label">${sent}/${total}</div>
          <button class="btn-remove" onclick="removeMember('${member.id}')" title="Remove member">×</button>
        </div>`;
    }).join('');
  }
}

// ── Theme ──────────────────────────────────────────────────────────────────
const THEME_KEY = 'kalos-tracker-theme';
const THEME_ORDER = ['auto', 'light', 'dark'];
const THEME_ICONS = { auto: '⊙', light: '☀', dark: '☽' };
const THEME_LABELS = { auto: 'Auto (OS)', light: 'Light', dark: 'Dark' };

function getThemePref() { return localStorage.getItem(THEME_KEY) || 'auto'; }

function applyTheme(pref) {
  if (pref === 'auto') {
    document.documentElement.removeAttribute('data-theme');
  } else {
    document.documentElement.setAttribute('data-theme', pref);
  }
  const btn = document.getElementById('btn-theme');
  if (btn) {
    btn.textContent = THEME_ICONS[pref];
    btn.title = THEME_LABELS[pref];
  }
}

function cycleTheme() {
  const current = getThemePref();
  const next = THEME_ORDER[(THEME_ORDER.indexOf(current) + 1) % THEME_ORDER.length];
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
}

// ── Init ───────────────────────────────────────────────────────────────────
document.getElementById('inp-date').value = today();

(async () => {
  applyTheme(getThemePref()); // set button icon once DOM is ready
  await fetchAllMembers();
  render();
})();
</script>
